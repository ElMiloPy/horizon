[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon on Android: NativeActivity entry points"
publish = false

[lib]
crate-type = ["cdylib"]
path = "../horizon-client/src/android_lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }
log = "0.4"
libc = "0.2"

[features]
default = ["audio"]
audio = ["horizon-client/audio"]

[lints]
workspace = true
